<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal SSO — SMAN 2 Karanganyar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
    /* Animasi loading tombol */
    .loader { border: 2px solid #f3f3f3; border-top: 2px solid #ffffff; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <!-- Kotak Login -->
  <div class="bg-white rounded-3xl max-w-md w-full p-8 md:p-10 shadow-xl shadow-slate-200/50 border border-slate-100 relative overflow-hidden">
    
    <!-- Ornamen Latar Belakang (Opsional) -->
    <div class="absolute top-0 right-0 -mr-16 -mt-16 w-32 h-32 rounded-full bg-slate-50 opacity-50 z-0"></div>
    <div class="absolute bottom-0 left-0 -ml-16 -mb-16 w-32 h-32 rounded-full bg-slate-50 opacity-50 z-0"></div>

    <div class="relative z-10 text-center mb-8">
      <div class="w-16 h-16 bg-slate-900 text-white rounded-2xl flex items-center justify-center font-bold text-2xl mx-auto mb-4 shadow-lg shadow-slate-900/20">
        <i class="fa-solid fa-school"></i>
      </div>
      <h1 class="font-bold text-2xl text-slate-900 tracking-tight">SMAN 2 Karanganyar</h1>
      <p class="text-sm text-slate-500 mt-1">Centralized School Ecosystem & SSO Portal</p>
    </div>

    <form id="login-form" onsubmit="handleLogin(event)" class="relative z-10 space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Username / NISN / NIP</label>
        <input id="login-username" required type="text" placeholder="Masukkan kredensial Anda" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 transition" />
      </div>
      
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <div class="relative">
          <input id="login-password" required type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 transition" />
          <button type="button" onclick="togglePassword()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
            <i id="eye-icon" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div id="login-error" class="hidden text-xs text-red-600 bg-red-50 p-3 rounded-xl border border-red-100 flex items-start gap-2">
        <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
        <span id="login-error-text"></span>
      </div>

      <button type="submit" id="login-btn" class="w-full py-3 rounded-xl bg-slate-900 text-white font-semibold text-sm hover:bg-slate-800 transition shadow-md shadow-slate-900/20 flex items-center justify-center gap-2">
        <span>Masuk ke Portal</span>
      </button>
    </form>

    <div class="mt-8 pt-6 border-t border-slate-100 text-center relative z-10">
      <a href="laporan-publik.html" class="text-xs font-semibold text-slate-500 hover:text-slate-900 transition flex items-center justify-center gap-2">
        <i class="fa-solid fa-chart-line"></i> Akses Laporan Presensi Publik
      </a>
      <p class="text-[11px] text-slate-400 mt-4">Mengalami masalah login? Hubungi Administrator System Sekolah.</p>
    </div>
  </div>

  <!-- Font Awesome (Untuk Ikon) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    // ==========================================
    // 1. CEK SESI (JIKA SUDAH LOGIN, LANGSUNG LEMPAR)
    // ==========================================
    (function checkSession() {
      const userSession = localStorage.getItem('smada_user');
      if (userSession) {
        try {
          const user = JSON.parse(userSession);
          // Cek apakah role-nya admin atau siswa
          const role = String(user.role || '').toLowerCase();
          
          if (role.includes('admin') || role.includes('piket') || role.includes('kontributor') || role.includes('super')) {
            window.location.replace('admin.html');
            return;
          } else if (role.includes('siswa') || user.nisn) {
            window.location.replace('siswa.html');
            return;
          }
        } catch (e) {
          // Jika data corrupt, hapus saja
          localStorage.removeItem('smada_user');
          localStorage.removeItem('smada_siswa');
        }
      }
    })();

    // ==========================================
    // 2. LOGIKA LOGIN
    // ==========================================
    async function handleLogin(e) {
      e.preventDefault();
      
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();
      const btn = document.getElementById('login-btn');
      const errBox = document.getElementById('login-error');
      const errText = document.getElementById('login-error-text');

      // UI Loading
      btn.disabled = true;
      btn.innerHTML = `<span class="loader"></span> <span>Memverifikasi...</span>`;
      errBox.classList.add('hidden');

      try {
        // Sesuaikan URL API ini dengan endpoint login Cloudflare Worker Anda
        // Asumsi: API login mengembalikan { ok: true, user: { nama, role, nisn, token } }
        const response = await fetch('https://smada-api-gateway.yhanedy.workers.dev/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || 'Username atau password salah.');
        }

        // ==========================================
        // 3. SIMPAN SESI & REDIRECT BERDASARKAN ROLE
        // ==========================================
        const user = data.user;
        const role = String(user.role || '').toLowerCase();

        // Simpan sesi universal
        localStorage.setItem('smada_user', JSON.stringify(user));

        // Jika role siswa, simpan juga ke smada_siswa agar kompatibel dengan siswa.html
        if (role.includes('siswa') || user.nisn) {
          localStorage.setItem('smada_siswa', JSON.stringify(user));
          window.location.replace('siswa.html');
        } 
        // Jika role admin/piket/guru
        else if (role.includes('admin') || role.includes('piket') || role.includes('kontributor') || role.includes('super')) {
          window.location.replace('admin.html');
        } 
        // Fallback jika role tidak dikenali
        else {
          alert('Role akun Anda tidak dikenali oleh sistem. Hubungi admin.');
          localStorage.removeItem('smada_user');
          btn.disabled = false;
          btn.innerHTML = `<span>Masuk ke Portal</span>`;
        }

      } catch (error) {
        // Tampilkan Error
        errText.textContent = error.message;
        errBox.classList.remove('hidden');
        
        // Reset Tombol
        btn.disabled = false;
        btn.innerHTML = `<span>Masuk ke Portal</span>`;
      }
    }

    // ==========================================
    // 4. FITUR LIHAT PASSWORD
    // ==========================================
    function togglePassword() {
      const input = document.getElementById('login-password');
      const icon = document.getElementById('eye-icon');
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }
  </script>
</body>
</html>
