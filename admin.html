<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin — Perpustakaan SMAN 2 Karanganyar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #E2E8F0; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #0F172A; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    .loader { border: 2px solid #334155; border-top: 2px solid #E2E8F0; border-radius: 50%; width: 14px; height: 14px; animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen flex h-screen overflow-hidden bg-slate-950">

  <!-- ================= HALAMAN LOGIN ADMIN ================= -->
  <div id="admin-login-screen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
    <div class="bg-slate-900 rounded-2xl max-w-sm w-full p-8 shadow-2xl border border-slate-700">
      <div class="text-center mb-6">
        <div class="w-12 h-12 bg-indigo-600 text-white rounded-xl flex items-center justify-center font-bold text-xl mx-auto mb-4 shadow-lg shadow-indigo-600/30">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="font-bold text-xl text-white tracking-tight">Panel Pengelola</h1>
        <p class="text-xs text-slate-400 mt-1">Perpustakaan SMAN 2 Karanganyar</p>
      </div>

      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <input id="adm-user" required type="text" placeholder="Username Admin" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none focus:border-indigo-500" />
        </div>
        <div>
          <input id="adm-pass" required type="password" placeholder="Password" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none focus:border-indigo-500" />
        </div>
        <div id="adm-login-error" class="hidden text-xs text-red-400 bg-red-400/10 border border-red-400/20 p-2.5 rounded-lg"></div>
        <button type="submit" id="adm-login-btn" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-semibold text-sm hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/30">
          Masuk ke Dashboard
        </button>
      </form>
      <div class="mt-6 text-center">
        <a href="index.html" class="text-xs font-semibold text-slate-500 hover:text-slate-300 transition">← Kembali ke Perpustakaan</a>
      </div>
    </div>
  </div>

  <!-- ================= DASHBOARD ADMIN ================= -->
  <div id="admin-dashboard-screen" class="hidden w-full flex h-screen overflow-hidden">
    
    <!-- SIDEBAR KIRI -->
    <aside class="w-20 lg:w-64 bg-slate-900 border-r border-slate-800 flex-col justify-between hidden md:flex shrink-0 transition-all duration-300 z-50">
      <div>
        <div class="h-20 flex items-center justify-center lg:justify-start lg:px-6 border-b border-slate-800">
          <div class="w-10 h-10 bg-indigo-500 text-white rounded-xl flex items-center justify-center font-bold text-lg shadow-lg shadow-indigo-500/30">S2</div>
          <span class="hidden lg:block font-bold text-lg text-white ml-3 tracking-wide">Admin Panel</span>
        </div>
        
        <div class="p-4 space-y-2 mt-4">
          <button onclick="setMenu('umum')" id="nav-umum" class="nav-btn w-full flex items-center justify-center lg:justify-start gap-4 px-3 py-3 rounded-xl bg-slate-800 text-white transition">
            <i class="fa-solid fa-book text-indigo-400"></i> <span class="hidden lg:block text-sm font-medium">Buku Umum</span>
          </button>
          <button onclick="setMenu('referensi')" id="nav-referensi" class="nav-btn w-full flex items-center justify-center lg:justify-start gap-4 px-3 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-lock text-amber-500"></i> <span class="hidden lg:block text-sm font-medium">Buku Referensi</span>
          </button>
          <button onclick="setMenu('users')" id="nav-users" class="nav-btn w-full flex items-center justify-center lg:justify-start gap-4 px-3 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white transition">
            <i class="fa-solid fa-users text-slate-400"></i> <span class="hidden lg:block text-sm font-medium">Manajemen Akun</span>
          </button>
        </div>
      </div>
      <div class="p-4 border-t border-slate-800">
        <button onclick="adminLogout()" class="w-full flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl text-xs font-semibold text-red-400 bg-red-500/10 hover:bg-red-500/20 transition">
          <i class="fa-solid fa-right-from-bracket"></i> <span class="hidden lg:block">Keluar</span>
        </button>
      </div>
    </aside>

    <!-- KONTEN UTAMA -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-950">
      
      <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 shrink-0">
        <h1 class="font-bold text-lg text-white" id="page-title">Kelola Buku Umum</h1>
        <div class="flex items-center gap-4">
          <a href="index.html" target="_blank" class="text-xs font-semibold text-indigo-400 hover:text-indigo-300">Lihat Web ↗</a>
          <div class="flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700 text-xs font-semibold text-slate-300">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span id="adm-profile-badge">Memuat...</span>
          </div>
        </div>
      </header>

      <div id="admin-content" class="flex-1 overflow-y-auto p-6 md:p-8">
        <div class="text-center py-12 text-slate-500 text-sm">Memuat data...</div>
      </div>
    </main>
  </div>

  <!-- ================= MODAL EDIT / TAMBAH BUKU ================= -->
  <div id="modal-book" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
    <div class="bg-slate-900 rounded-2xl w-full max-w-2xl shadow-2xl flex flex-col max-h-[90vh] border border-slate-700">
      <div class="flex items-center justify-between p-6 border-b border-slate-800">
        <h2 id="modal-book-title" class="font-bold text-lg text-white">Tambah Buku</h2>
        <button onclick="closeModal('modal-book')" class="text-slate-400 hover:text-red-400 text-xl">&times;</button>
      </div>
      
      <div class="p-6 overflow-y-auto space-y-4 flex-1">
        <input type="hidden" id="book-id" value="">
        
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Link PDF (Google Drive)</label>
          <div class="flex gap-2">
            <input id="book-pdf" type="url" placeholder="https://drive.google.com/..." class="flex-1 px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none focus:border-indigo-500" />
            <button type="button" onclick="autoExtractPdf()" class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-500 shrink-0">Ekstrak</button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Judul Buku</label>
            <input id="book-title" type="text" placeholder="Masukkan judul" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Kategori</label>
            <select id="book-category" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none focus:border-indigo-500">
              <!-- Diisi via JS -->
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Penulis</label>
            <input id="book-author" type="text" value="Tim Guru SMAN 2 Karanganyar" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none focus:border-indigo-500" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">URL Sampul</label>
            <input id="book-thumb" type="text" placeholder="https://..." class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none focus:border-indigo-500" />
          </div>
        </div>
      </div>

      <div class="p-6 border-t border-slate-800 flex justify-end gap-3 bg-slate-900/50 rounded-b-2xl">
        <button onclick="closeModal('modal-book')" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-400 hover:bg-slate-800 transition">Batal</button>
        <button onclick="saveBook()" id="btn-save-book" class="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/30">Simpan Data</button>
      </div>
    </div>
  </div>

  <!-- ================= MODAL TAMBAH KATEGORI ================= -->
  <div id="modal-cat" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
    <div class="bg-slate-900 rounded-2xl w-full max-w-sm shadow-2xl p-6 border border-slate-700">
      <h2 class="font-bold text-lg text-white mb-4">Tambah Kategori Baru</h2>
      <input id="new-cat-name" type="text" placeholder="Nama Kategori" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none focus:border-indigo-500 mb-4" />
      <div class="flex justify-end gap-2">
        <button onclick="closeModal('modal-cat')" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-400 hover:bg-slate-800">Batal</button>
        <button onclick="saveCategory()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-500">Tambah</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://perpus-smanda.yhanedy.workers.dev'; 

    let state = {
      user: JSON.parse(localStorage.getItem('smanda_admin') || 'null'),
      categories: [],
      books: [],
      activeMenu: 'umum',
      editingBookId: null
    };

    initAdmin();

    async function initAdmin() {
      if (!state.user || (state.user.role !== 'super_admin' && state.user.role !== 'kontributor')) {
        document.getElementById('admin-login-screen').classList.remove('hidden');
        document.getElementById('admin-dashboard-screen').classList.add('hidden');
        return;
      }

      document.getElementById('admin-login-screen').classList.add('hidden');
      document.getElementById('admin-dashboard-screen').classList.remove('hidden');
      document.getElementById('admin-dashboard-screen').classList.add('flex');
      document.getElementById('adm-profile-badge').textContent = `${state.user.nama}`;

      await fetchData();
      setMenu('umum');
    }

    async function fetchData() {
      try {
        const res = await fetch(`${API_URL}/api/init`);
        const data = await res.json();
        if (data.ok) {
          state.categories = data.categories;
          state.books = data.books;
        }
      } catch (e) {
        alert("Error koneksi API: " + e.message);
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const username = document.getElementById('adm-user').value;
      const password = document.getElementById('adm-pass').value;
      const errBox = document.getElementById('adm-login-error');
      const btn = document.getElementById('adm-login-btn');

      btn.innerHTML = '<span class="loader"></span>';
      btn.disabled = true;
      errBox.classList.add('hidden');

      try {
        const res = await fetch(`${API_URL}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (!data.ok) {
          errBox.textContent = data.error || 'Gagal login.';
          errBox.classList.remove('hidden');
          return;
        }
        if (data.user.role !== 'super_admin' && data.user.role !== 'kontributor') {
          errBox.textContent = 'Akun siswa tidak diizinkan masuk.';
          errBox.classList.remove('hidden');
          return;
        }
        
        state.user = data.user;
        localStorage.setItem('smanda_admin', JSON.stringify(data.user));
        initAdmin();
      } catch (err) {
        errBox.textContent = 'Kesalahan jaringan: ' + err.message;
        errBox.classList.remove('hidden');
      } finally {
        btn.innerHTML = 'Masuk ke Dashboard';
        btn.disabled = false;
      }
    }

    function adminLogout() {
      state.user = null;
      localStorage.removeItem('smanda_admin');
      initAdmin();
    }

    function setMenu(menu) {
      state.activeMenu = menu;
      
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-slate-800', 'text-white');
        btn.classList.add('text-slate-400', 'hover:bg-slate-800');
      });
      
      const activeBtn = document.getElementById('nav-' + menu);
      if(activeBtn) {
        activeBtn.classList.remove('text-slate-400', 'hover:bg-slate-800');
        activeBtn.classList.add('bg-slate-800', 'text-white');
      }

      const titles = {
        'umum': 'Kelola Buku Umum',
        'referensi': 'Kelola Buku Referensi',
        'users': 'Manajemen Akun'
      };
      document.getElementById('page-title').textContent = titles[menu];

      if(menu === 'users') {
        renderUsersMenu();
      } else {
        renderBooksMenu();
      }
    }

    function renderBooksMenu() {
      const isUmum = state.activeMenu === 'umum';
      const catData = state.categories.filter(c => c.access_type === state.activeMenu);
      const filteredBooks = state.books.filter(b => b.access_type === state.activeMenu);

      const html = `
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
          <div class="flex gap-2">
            <button onclick="openModalBook()" class="px-4 py-2 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-500 transition shadow-sm flex items-center gap-2">
              <i class="fa-solid fa-plus"></i> Tambah Buku
            </button>
            <button onclick="openModalCat()" class="px-4 py-2 rounded-xl bg-slate-800 border border-slate-700 text-slate-300 text-sm font-semibold hover:bg-slate-700 transition shadow-sm flex items-center gap-2">
              <i class="fa-solid fa-folder-plus"></i> Kategori
            </button>
          </div>
          
          <div class="flex gap-2 w-full md:w-auto">
            <select id="filter-cat" onchange="filterTableBooks()" class="px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none">
              <option value="all">Semua Kategori</option>
              ${catData.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
            </select>
            <input type="text" id="search-book" oninput="filterTableBooks()" placeholder="Cari judul..." class="px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none w-full md:w-64" />
          </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl shadow-sm overflow-hidden">
          <table class="w-full text-left border-collapse" id="table-books">
            <thead class="bg-slate-800/50 border-b border-slate-800">
              <tr>
                <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Judul Buku & Kategori</th>
                <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Penulis</th>
                <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider text-right">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-800 text-sm">
              ${filteredBooks.length === 0 ? `<tr><td colspan="3" class="px-6 py-8 text-center text-slate-500">Belum ada data buku.</td></tr>` : 
                filteredBooks.map(b => `
                  <tr class="hover:bg-slate-800/50 transition book-row" data-title="${b.title.toLowerCase()}" data-cat="${b.category_id}">
                    <td class="px-6 py-4">
                      <div class="font-semibold text-slate-200 mb-0.5">${b.title}</div>
                      <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wide uppercase ${isUmum ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'}">
                        ${b.category_name || 'Tanpa Kategori'}
                      </span>
                    </td>
                    <td class="px-6 py-4 text-slate-400">${b.author || '-'}</td>
                    <td class="px-6 py-4 text-right space-x-2">
                      <a href="${b.pdf_url}" target="_blank" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-800 text-slate-400 hover:bg-slate-700 transition" title="Lihat"><i class="fa-solid fa-eye text-xs"></i></a>
                      <button onclick="openModalBook('${b.id}')" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-400 hover:bg-indigo-500/20 transition" title="Edit"><i class="fa-solid fa-pen text-xs"></i></button>
                      <button onclick="deleteBook('${b.id}')" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-red-500/10 text-red-400 hover:bg-red-500/20 transition" title="Hapus"><i class="fa-solid fa-trash text-xs"></i></button>
                    </td>
                  </tr>
                `).join('')}
            </tbody>
          </table>
        </div>
      `;
      document.getElementById('admin-content').innerHTML = html;
    }

    function filterTableBooks() {
      const q = document.getElementById('search-book').value.toLowerCase();
      const cat = document.getElementById('filter-cat').value;
      document.querySelectorAll('.book-row').forEach(row => {
        const matchTitle = row.dataset.title.includes(q);
        const matchCat = cat === 'all' || row.dataset.cat === cat;
        row.style.display = (matchTitle && matchCat) ? '' : 'none';
      });
    }

    function openModalBook(editId = null) {
      const modal = document.getElementById('modal-book');
      const title = document.getElementById('modal-book-title');
      const catSelect = document.getElementById('book-category');
      
      const catData = state.categories.filter(c => c.access_type === state.activeMenu);
      catSelect.innerHTML = catData.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

      if (editId) {
        const book = state.books.find(b => b.id === editId);
        if (!book) return;
        title.textContent = 'Edit Data Buku';
        document.getElementById('book-id').value = book.id;
        document.getElementById('book-pdf').value = book.pdf_url;
        document.getElementById('book-title').value = book.title;
        document.getElementById('book-author').value = book.author;
        document.getElementById('book-thumb').value = book.thumbnail_url;
        catSelect.value = book.category_id;
      } else {
        title.textContent = 'Tambah Buku Baru';
        document.getElementById('book-id').value = '';
        document.getElementById('book-pdf').value = '';
        document.getElementById('book-title').value = '';
        document.getElementById('book-author').value = 'Tim Guru SMAN 2 Karanganyar';
        document.getElementById('book-thumb').value = '';
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    async function autoExtractPdf() {
      const url = document.getElementById('book-pdf').value.trim();
      if (!url) return alert('Masukkan link PDF terlebih dahulu.');
      
      const btn = event.target;
      const oldText = btn.innerHTML;
      btn.innerHTML = '...';
      btn.disabled = true;

      try {
        const res = await fetch(`${API_URL}/api/extract`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pdf_url: url })
        });
        const data = await res.json();
        if (data.ok) {
          document.getElementById('book-title').value = data.title || '';
          document.getElementById('book-thumb').value = data.thumbnailUrl || '';
        } else {
          alert('Gagal mengekstrak metadata.');
        }
      } catch (e) {
        alert('Error ekstraksi: ' + e.message);
      } finally {
        btn.innerHTML = oldText;
        btn.disabled = false;
      }
    }

    async function saveBook() {
      const id = document.getElementById('book-id').value;
      const pdf_url = document.getElementById('book-pdf').value.trim();
      const title = document.getElementById('book-title').value.trim();
      const category_id = document.getElementById('book-category').value;
      const author = document.getElementById('book-author').value.trim();
      const thumbnail_url = document.getElementById('book-thumb').value.trim();

      if (!pdf_url || !title) return alert('Link PDF dan Judul wajib diisi.');

      const btn = document.getElementById('btn-save-book');
      btn.innerHTML = '<span class="loader"></span>';
      btn.disabled = true;

      try {
        const urlApi = id ? '/api/books/update' : '/api/books'; 
        const payload = {
          id: id,
          title, author, pdf_url, thumbnail_url, category_id,
          access_type: state.activeMenu,
          uploaded_by: state.user.username
        };

        const res = await fetch(API_URL + urlApi, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        if (data.ok) {
          closeModal('modal-book');
          await fetchData();
          setMenu(state.activeMenu);
        } else {
          alert("Gagal menyimpan: " + data.error);
        }
      } catch (e) {
        alert("Kesalahan koneksi: " + e.message);
      } finally {
        btn.innerHTML = 'Simpan Data';
        btn.disabled = false;
      }
    }

    async function deleteBook(id) {
      if (!confirm('Yakin ingin menghapus dokumen ini?')) return;
      try {
        await fetch(`${API_URL}/api/books/delete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        await fetchData();
        setMenu(state.activeMenu);
      } catch (e) {
        alert("Gagal menghapus: " + e.message);
      }
    }

    function openModalCat() {
      document.getElementById('modal-cat').classList.remove('hidden');
      document.getElementById('modal-cat').classList.add('flex');
      document.getElementById('new-cat-name').value = '';
      document.getElementById('new-cat-name').focus();
    }

    async function saveCategory() {
      const name = document.getElementById('new-cat-name').value.trim();
      if (!name) return;

      try {
        await fetch(`${API_URL}/api/categories`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, access_type: state.activeMenu })
        });
        closeModal('modal-cat');
        await fetchData();
        setMenu(state.activeMenu);
      } catch (e) {
        alert("Gagal menambah kategori: " + e.message);
      }
    }

    function renderUsersMenu() {
      if (state.user.role !== 'super_admin') {
        document.getElementById('admin-content').innerHTML = `<div class="bg-amber-500/10 text-amber-400 p-4 rounded-xl border border-amber-500/20 text-sm">Hanya Super Admin yang dapat mengakses Manajemen Akun.</div>`;
        return;
      }

      document.getElementById('admin-content').innerHTML = `
        <div class="grid md:grid-cols-3 gap-6">
          <div class="md:col-span-1 bg-slate-900 border border-slate-800 rounded-2xl p-6 h-fit shadow-sm">
            <h2 class="font-bold text-slate-200 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-user-plus text-slate-400"></i> Tambah Akun
            </h2>
            <form onsubmit="createUser(event)" class="space-y-4">
              <div>
                <input id="usr-nama" type="text" required placeholder="Nama Lengkap" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none focus:border-indigo-500" />
              </div>
              <div>
                <input id="usr-username" type="text" required placeholder="Username / NIS" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none focus:border-indigo-500" />
              </div>
              <div>
                <input id="usr-pass" type="text" required placeholder="Password" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none focus:border-indigo-500" />
              </div>
              <div>
                <select id="usr-role" class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm text-white outline-none focus:border-indigo-500">
                  <option value="kontributor">Admin (Guru)</option>
                  <option value="siswa">Siswa</option>
                  <option value="super_admin">Super Admin</option>
                </select>
              </div>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white text-sm font-semibold hover:bg-indigo-500 transition">Buat Akun</button>
            </form>
          </div>

          <div class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl shadow-sm overflow-hidden flex flex-col">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-800/30">
              <h2 class="font-bold text-slate-200 text-sm">Daftar Pengguna</h2>
            </div>
            <div id="users-list-box" class="overflow-y-auto flex-1">
              <div class="p-8 text-center text-slate-500 text-sm">Memuat akun...</div>
            </div>
          </div>
        </div>
      `;
      loadUsersList();
    }

    async function loadUsersList() {
      try {
        const res = await fetch(`${API_URL}/api/users`);
        const data = await res.json();
        const box = document.getElementById('users-list-box');
        if (!box || !data.ok) return;
        
        if(data.users.length === 0) {
           box.innerHTML = '<div class="p-8 text-center text-slate-500 text-sm">Belum ada akun.</div>';
           return;
        }

        box.innerHTML = data.users.map(u => `
          <div class="flex items-center justify-between p-4 border-b border-slate-800 hover:bg-slate-800/50 transition">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-xs uppercase">
                ${u.nama.charAt(0)}
              </div>
              <div>
                <div class="font-semibold text-sm text-slate-200">${u.nama}</div>
                <div class="text-xs text-slate-500">@${u.username} • <span class="uppercase text-[10px] font-bold">${u.role}</span></div>
              </div>
            </div>
            <div>
               <button onclick="toggleUser('${u.id}', ${String(u.is_active) === '1' ? 0 : 1})" class="text-xs font-semibold px-3 py-1.5 rounded-lg border ${String(u.is_active) === '1' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20 hover:bg-emerald-500/20' : 'bg-red-500/10 text-red-400 border-red-500/20 hover:bg-red-500/20'} transition">
                  ${String(u.is_active) === '1' ? 'Aktif' : 'Nonaktif'}
               </button>
            </div>
          </div>
        `).join('');
      } catch(e) { console.error(e); }
    }

    async function createUser(e) {
      e.preventDefault();
      const nama = document.getElementById('usr-nama').value.trim();
      const username = document.getElementById('usr-username').value.trim();
      const password = document.getElementById('usr-pass').value.trim();
      const role = document.getElementById('usr-role').value;
      
      const btn = e.target.querySelector('button[type="submit"]');
      btn.innerHTML = '...'; btn.disabled = true;

      try {
        await fetch(`${API_URL}/api/users`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, username, password, role })
        });
        e.target.reset();
        loadUsersList();
      } catch (err) {
        alert("Gagal tambah akun: " + err.message);
      } finally {
        btn.innerHTML = 'Buat Akun'; btn.disabled = false;
      }
    }

    async function toggleUser(id, is_active) {
      try {
        await fetch(`${API_URL}/api/users/toggle`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, is_active })
        });
        loadUsersList();
      } catch (e) { alert("Gagal update status akun."); }
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      document.getElementById(id).classList.remove('flex');
    }
  </script>
</body>
</html>
