<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Pengelola — Perpustakaan SMAN 2 Karanganyar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F6F4F0; color: #1E293B; }
    .warm-sand { background-color: #EAE5DC; }
    .deep-teal { background-color: #2B5459; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- HALAMAN LOGIN KHUSUS ADMIN / PENGELOLA -->
  <div id="admin-login-screen" class="flex-1 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-7 shadow-sm border border-stone-200/80">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-xl deep-teal text-white flex items-center justify-center font-bold text-sm">S2</div>
        <div>
          <h1 class="font-bold text-base text-stone-900">Login Pengelola</h1>
          <p class="text-xs text-stone-400">Perpustakaan SMAN 2 Karanganyar</p>
        </div>
      </div>

      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-stone-700">Username Admin / Guru</label>
          <input id="adm-user" required type="text" placeholder="Masukkan username pengelola" class="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-sm outline-none focus:border-[#2B5459]" />
        </div>
        <div>
          <label class="text-xs font-semibold text-stone-700">Password</label>
          <input id="adm-pass" required type="password" placeholder="••••••••" class="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-sm outline-none focus:border-[#2B5459]" />
        </div>
        <div id="adm-login-error" class="hidden text-xs text-red-600 bg-red-50 p-3 rounded-xl"></div>
        <button type="submit" id="adm-login-btn" class="w-full py-2.5 rounded-xl deep-teal text-white font-semibold text-sm hover:opacity-95 transition">
          Masuk ke Dashboard Admin
        </button>
      </form>

      <div class="mt-5 pt-4 border-t border-stone-100 text-center">
        <a href="/" class="text-xs font-semibold text-[#2B5459] hover:underline">← Kembali ke Halaman Utama Perpustakaan</a>
      </div>
    </div>
  </div>

  <!-- DASHBOARD PENGELOLA (MUNCUL SETELAH LOGIN ADMIN) -->
  <div id="admin-dashboard-screen" class="hidden flex-1 flex flex-col">
    <header class="deep-teal text-white px-4 md:px-10 py-3.5 flex items-center justify-between shadow-xs sticky top-0 z-30">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-white/15 flex items-center justify-center font-bold text-xs">S2</div>
        <div>
          <div class="font-bold text-xs md:text-sm tracking-wide">PANEL PENGELOLA PERPUSTAKAAN</div>
          <div id="adm-profile-badge" class="text-[11px] text-teal-100">SMAN 2 Karanganyar</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <a href="/" class="px-3 py-1.5 rounded-xl bg-white/15 hover:bg-white/25 text-xs font-semibold">Lihat Web ↗</a>
        <button onclick="adminLogout()" class="px-3 py-1.5 rounded-xl bg-red-500/90 hover:bg-red-600 text-xs font-semibold">Keluar</button>
      </div>
    </header>

    <main id="admin-content" class="max-w-6xl w-full mx-auto px-4 md:px-8 py-6 space-y-6">
      <div class="text-center py-12 text-stone-400 text-sm">Memuat data perpustakaan...</div>
    </main>
  </div>

  <script>
    let state = {
      user: JSON.parse(localStorage.getItem('smanda_admin') || 'null'),
      categories: [],
      books: [],
      tab: 'umum'
    };

    async function initAdmin() {
      if (!state.user || (state.user.role !== 'super_admin' && state.user.role !== 'kontributor')) {
        document.getElementById('admin-login-screen').classList.remove('hidden');
        document.getElementById('admin-dashboard-screen').classList.add('hidden');
        return;
      }

      document.getElementById('admin-login-screen').classList.add('hidden');
      document.getElementById('admin-dashboard-screen').classList.remove('hidden');
      document.getElementById('adm-profile-badge').textContent = `${state.user.nama} (${state.user.role.replace('_', ' ').toUpperCase()})`;

      const res = await fetch('/api/init');
      const data = await res.json();
      if (data.ok) {
        state.categories = data.categories;
        state.books = data.books;
        renderDashboard();
      } else {
        document.getElementById('admin-content').innerHTML = `<div class="bg-red-50 text-red-700 p-4 rounded-2xl text-xs">Error Database: ${data.error}</div>`;
      }
    }

    async function handleAdminLogin(e) {
      e.preventDefault();
      const username = document.getElementById('adm-user').value;
      const password = document.getElementById('adm-pass').value;
      const errBox = document.getElementById('adm-login-error');
      const btn = document.getElementById('adm-login-btn');

      btn.textContent = 'Memeriksa...';
      btn.disabled = true;
      errBox.classList.add('hidden');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!data.ok) {
          errBox.textContent = data.error || 'Gagal login.';
          errBox.classList.remove('hidden');
          return;
        }
        if (data.user.role !== 'super_admin' && data.user.role !== 'kontributor') {
          errBox.textContent = 'Akun siswa tidak memiliki izin masuk ke halaman pengelola. Silakan login melalui halaman utama.';
          errBox.classList.remove('hidden');
          return;
        }
        state.user = data.user;
        localStorage.setItem('smanda_admin', JSON.stringify(data.user));
        initAdmin();
      } catch (err) {
        errBox.textContent = 'Kesalahan jaringan: ' + err.message;
        errBox.classList.remove('hidden');
      } finally {
        btn.textContent = 'Masuk ke Dashboard Admin';
        btn.disabled = false;
      }
    }

    function adminLogout() {
      state.user = null;
      localStorage.removeItem('smanda_admin');
      initAdmin();
    }

    function renderDashboard() {
      const isSuperAdmin = state.user.role === 'super_admin';
      const filteredCats = state.categories.filter(c => c.access_type === state.tab);

      document.getElementById('admin-content').innerHTML = `
        <div class="flex flex-wrap gap-2">
          <button onclick="state.tab='umum';renderDashboard()" class="px-4 py-2.5 rounded-xl text-xs font-bold transition ${state.tab === 'umum' ? 'deep-teal text-white' : 'bg-white text-stone-600 border border-stone-200'}">
            📚 1. Kelola Buku Umum (Akses Publik)
          </button>
          <button onclick="state.tab='referensi';renderDashboard()" class="px-4 py-2.5 rounded-xl text-xs font-bold transition ${state.tab === 'referensi' ? 'bg-amber-600 text-white' : 'bg-white text-stone-600 border border-stone-200'}">
            🔐 2. Kelola Buku Referensi (Khusus Login Siswa)
          </button>
        </div>

        <div class="grid md:grid-cols-3 gap-6">
          <div class="md:col-span-2 bg-white rounded-3xl p-5 md:p-6 border border-stone-200/80 space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="text-base font-bold text-stone-900">
                ${state.tab === 'umum' ? 'Tambah Buku Umum / Mata Pelajaran / Novel' : 'Tambah Buku Referensi (TKA, SMBT, Data Soal)'}
              </h2>
              <span class="text-[11px] px-2.5 py-1 rounded-full font-semibold ${state.tab === 'umum' ? 'bg-emerald-50 text-emerald-700' : 'bg-amber-50 text-amber-800'}">
                ${state.tab === 'umum' ? 'Publik' : 'Khusus Login'}
              </span>
            </div>

            <div>
              <label class="text-xs font-semibold text-stone-700">Link PDF (Google Drive atau URL .pdf langsung)</label>
              <div class="mt-1 flex gap-2">
                <input id="adm-pdf-url" type="url" placeholder="https://drive.google.com/file/d/..." class="flex-1 px-3.5 py-2.5 rounded-xl border border-stone-200 text-xs outline-none focus:border-[#2B5459]" />
                <button type="button" onclick="autoExtractPdf()" class="px-3.5 py-2.5 rounded-xl bg-stone-900 text-white text-xs font-semibold shrink-0">Ambil Otomatis</button>
              </div>
              <p id="extract-status" class="text-[11px] text-stone-400 mt-1">Otomatis menarik judul dan gambar sampul dari PDF/Drive.</p>
            </div>

            <div class="grid sm:grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold text-stone-700">Judul Dokumen</label>
                <input id="adm-title" type="text" placeholder="Judul buku atau modul" class="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-xs outline-none" />
              </div>
              <div>
                <label class="text-xs font-semibold text-stone-700">Kategori</label>
                <select id="adm-category" class="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-xs outline-none bg-white">
                  ${filteredCats.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                </select>
              </div>
            </div>

            <div class="grid sm:grid-cols-2 gap-3">
              <div>
                <label class="text-xs font-semibold text-stone-700">Penulis / Penyusun</label>
                <input id="adm-author" type="text" value="Tim Guru SMAN 2 Karanganyar" class="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-xs outline-none" />
              </div>
              <div>
                <label class="text-xs font-semibold text-stone-700">URL Thumbnail Sampul</label>
                <input id="adm-thumb" oninput="updateThumbPreview()" type="text" placeholder="Otomatis terisi" class="mt-1 w-full px-3.5 py-2.5 rounded-xl border border-stone-200 text-xs outline-none" />
              </div>
            </div>

            <button onclick="saveNewBook()" class="w-full py-3 rounded-xl deep-teal text-white font-bold text-xs md:text-sm hover:opacity-95 transition">
              Simpan & Publikasikan Dokumen
            </button>
          </div>

          <div class="space-y-4">
            <div class="bg-white rounded-3xl p-5 border border-stone-200/80 flex flex-col items-center text-center">
              <div class="text-xs font-bold text-stone-700 mb-3">Pratinjau Sampul</div>
              <div id="thumb-preview-box" class="w-32 aspect-[3/4] rounded-xl bg-stone-100 border border-dashed border-stone-300 flex items-center justify-center text-[11px] text-stone-400 overflow-hidden">
                Belum ada sampul
              </div>
            </div>

            <div class="bg-white rounded-3xl p-5 border border-stone-200/80 space-y-2.5">
              <div class="text-xs font-bold text-stone-800">+ Tambah Sub-Kategori (${state.tab === 'umum' ? 'Umum' : 'Referensi'})</div>
              <div class="flex gap-2">
                <input id="new-cat-name" type="text" placeholder="Nama kategori baru..." class="flex-1 px-3 py-2 rounded-xl border border-stone-200 text-xs outline-none" />
                <button onclick="addNewCategory()" class="px-3 py-2 rounded-xl bg-stone-800 text-white text-xs font-semibold">Tambah</button>
              </div>
            </div>
          </div>
        </div>

        <div class="bg-white rounded-3xl p-5 md:p-6 border border-stone-200/80">
          <h3 class="text-sm font-bold text-stone-900 mb-4">Daftar Dokumen Tersimpan (${state.books.length})</h3>
          <div class="divide-y divide-stone-100">
            ${state.books.map(b => `
              <div class="py-3 flex items-center justify-between gap-3">
                <div class="min-w-0">
                  <div class="text-xs font-bold text-stone-800 truncate">${b.title}</div>
                  <div class="text-[11px] text-stone-400">${b.category_name || '-'} • <span class="uppercase font-semibold">${b.access_type}</span></div>
                </div>
                <button onclick="deleteBook('${b.id}')" class="px-3 py-1.5 rounded-lg bg-red-50 text-red-600 text-xs font-semibold hover:bg-red-100 shrink-0">Hapus</button>
              </div>`).join('')}
          </div>
        </div>

        ${isSuperAdmin ? `
        <div class="bg-white rounded-3xl p-5 md:p-6 border border-stone-200/80 space-y-4">
          <h3 class="text-sm font-bold text-stone-900">Kelola Akun Turunan Admin & Siswa</h3>
          <div class="grid sm:grid-cols-4 gap-2.5">
            <input id="usr-nama" type="text" placeholder="Nama Lengkap" class="px-3 py-2 rounded-xl border border-stone-200 text-xs" />
            <input id="usr-username" type="text" placeholder="Username / NIS" class="px-3 py-2 rounded-xl border border-stone-200 text-xs" />
            <input id="usr-pass" type="text" placeholder="Password" class="px-3 py-2 rounded-xl border border-stone-200 text-xs" />
            <div class="flex gap-2">
              <select id="usr-role" class="flex-1 px-2.5 py-2 rounded-xl border border-stone-200 text-xs bg-white">
                <option value="kontributor">Turunan Admin (Guru/Petugas)</option>
                <option value="siswa">Siswa (Akses Referensi)</option>
                <option value="super_admin">Super Admin</option>
              </select>
              <button onclick="createUser()" class="px-3.5 py-2 rounded-xl deep-teal text-white text-xs font-semibold">Buat</button>
            </div>
          </div>
          <div id="users-list-box" class="text-xs text-stone-500">Memuat daftar akun...</div>
        </div>` : ''}
      `;

      if (isSuperAdmin) loadUsersList();
    }

    async function autoExtractPdf() {
      const url = document.getElementById('adm-pdf-url').value.trim();
      if (!url) return alert('Tempel link PDF terlebih dahulu.');
      const status = document.getElementById('extract-status');
      status.textContent = 'Mengambil judul & sampul...';
      const res = await fetch('/api/extract', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pdf_url: url })
      });
      const data = await res.json();
      if (data.ok) {
        document.getElementById('adm-title').value = data.title;
        document.getElementById('adm-thumb').value = data.thumbnailUrl || '';
        updateThumbPreview();
        status.textContent = 'Berhasil diekstrak!';
      }
    }

    function updateThumbPreview() {
      const thumb = document.getElementById('adm-thumb').value.trim();
      const box = document.getElementById('thumb-preview-box');
      box.innerHTML = thumb ? `<img src="${thumb}" class="w-full h-full object-cover" />` : 'Otomatis cover tipografi';
    }

    async function saveNewBook() {
      const pdf_url = document.getElementById('adm-pdf-url').value.trim();
      const title = document.getElementById('adm-title').value.trim();
      const category_id = document.getElementById('adm-category').value;
      const author = document.getElementById('adm-author').value.trim();
      const thumbnail_url = document.getElementById('adm-thumb').value.trim();
      if (!pdf_url || !title) return alert('Link PDF dan Judul wajib diisi.');

      const res = await fetch('/api/books', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title, author, pdf_url, thumbnail_url, category_id,
          access_type: state.tab,
          uploaded_by: state.user.username
        })
      });
      if ((await res.json()).ok) {
        alert('Dokumen berhasil disimpan!');
        initAdmin();
      }
    }

    async function deleteBook(id) {
      if (!confirm('Hapus dokumen ini?')) return;
      await fetch('/api/books/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      initAdmin();
    }

    async function addNewCategory() {
      const name = document.getElementById('new-cat-name').value.trim();
      if (!name) return;
      await fetch('/api/categories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, access_type: state.tab })
      });
      initAdmin();
    }

    async function loadUsersList() {
      const res = await fetch('/api/users');
      const data = await res.json();
      const box = document.getElementById('users-list-box');
      if (!box || !data.ok) return;
      box.innerHTML = '<div class="divide-y divide-stone-100">' + data.users.map(u => `
        <div class="py-2.5 flex items-center justify-between">
          <div>
            <span class="font-bold text-stone-800">${u.nama}</span> (<span class="text-stone-500">${u.username}</span>)
            <span class="ml-2 px-2 py-0.5 rounded bg-stone-100 text-[10px] font-semibold uppercase">${u.role}</span>
          </div>
          <button onclick="toggleUser('${u.id}', ${String(u.is_active) === '1' ? 0 : 1})" class="text-xs font-semibold ${String(u.is_active) === '1' ? 'text-emerald-700' : 'text-red-600'}">
            ${String(u.is_active) === '1' ? 'Aktif' : 'Nonaktif'}
          </button>
        </div>`).join('') + '</div>';
    }

    async function createUser() {
      const nama = document.getElementById('usr-nama').value.trim();
      const username = document.getElementById('usr-username').value.trim();
      const password = document.getElementById('usr-pass').value.trim();
      const role = document.getElementById('usr-role').value;
      if (!nama || !username || !password) return alert('Lengkapi semua kolom akun.');
      await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nama, username, password, role })
      });
      loadUsersList();
    }

    async function toggleUser(id, is_active) {
      await fetch('/api/users/toggle', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, is_active })
      });
      loadUsersList();
    }

    initAdmin();
  </script>
</body>
</html>
