<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Pengelola — SMAN 2 Karanganyar</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; color: #0F172A; }
    /* Scrollbar tipis minimalis */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  </style>
</head>
<body class="min-h-screen flex text-slate-800">

  <!-- ================= HALAMAN LOGIN (MUNCUL JIKA BELUM LOGIN) ================= -->
  <div id="admin-login-screen" class="fixed inset-0 z-50 bg-slate-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-xl shadow-slate-200/50 border border-slate-100">
      
      <div class="text-center mb-8">
        <div class="w-12 h-12 bg-slate-900 text-white rounded-xl flex items-center justify-center font-bold text-xl mx-auto mb-4 shadow-lg">S2</div>
        <h1 class="font-bold text-2xl text-slate-900 tracking-tight">Panel Pengelola</h1>
        <p class="text-sm text-slate-500 mt-1">SMAN 2 Karanganyar</p>
      </div>

      <form onsubmit="handleAdminLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Username / Email</label>
          <input id="adm-user" required type="text" placeholder="Masukkan username pengelola" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 transition" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
          <input id="adm-pass" required type="password" placeholder="••••••••" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900 focus:ring-1 focus:ring-slate-900 transition" />
        </div>
        <div id="adm-login-error" class="hidden text-xs text-red-600 bg-red-50 p-3 rounded-lg border border-red-100"></div>
        <button type="submit" id="adm-login-btn" class="w-full py-3 rounded-xl bg-slate-900 text-white font-semibold text-sm hover:bg-slate-800 transition shadow-md shadow-slate-900/20">
          Masuk ke Dashboard
        </button>
      </form>

      <div class="mt-6 pt-6 border-t border-slate-100 text-center">
        <a href="/" class="text-xs font-semibold text-slate-500 hover:text-slate-900 transition">← Kembali ke Perpustakaan</a>
      </div>
    </div>
  </div>

  <!-- ================= DASHBOARD UTAMA ================= -->
  <div id="admin-dashboard-screen" class="hidden w-full flex h-screen overflow-hidden">
    
    <!-- SIDEBAR -->
    <aside class="w-64 bg-white border-r border-slate-200 flex-col justify-between hidden md:flex shrink-0">
      <div>
        <div class="h-16 flex items-center gap-3 px-6 border-b border-slate-100">
          <div class="w-8 h-8 bg-slate-900 text-white rounded-lg flex items-center justify-center font-bold text-xs shadow-sm">S2</div>
          <span class="font-bold text-sm tracking-tight">Perpus Smanda</span>
        </div>
        <div class="p-4 space-y-1">
          <button onclick="setMenu('umum')" id="nav-umum" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-50">
            <i class="fa-solid fa-book"></i> Buku Umum
          </button>
          <button onclick="setMenu('referensi')" id="nav-referensi" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-50">
            <i class="fa-solid fa-lock"></i> Buku Referensi
          </button>
          <button onclick="setMenu('users')" id="nav-users" class="nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition text-slate-600 hover:bg-slate-50">
            <i class="fa-solid fa-users"></i> Manajemen Akun
          </button>
        </div>
      </div>
      <div class="p-4 border-t border-slate-100">
        <button onclick="adminLogout()" class="w-full flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl text-sm font-semibold text-red-600 bg-red-50 hover:bg-red-100 transition">
          <i class="fa-solid fa-right-from-bracket"></i> Keluar
        </button>
      </div>
    </aside>

    <!-- KONTEN UTAMA -->
    <main class="flex-1 flex flex-col h-full overflow-hidden bg-slate-50 relative">
      
      <!-- Header Topbar -->
      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-6 shrink-0">
        <h1 class="font-bold text-lg" id="page-title">Kelola Buku Umum</h1>
        <div class="flex items-center gap-4">
          <a href="/" target="_blank" class="text-xs font-semibold text-slate-500 hover:text-slate-900">Lihat Web ↗</a>
          <div class="flex items-center gap-2 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200 text-xs font-semibold text-slate-700">
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
            <span id="adm-profile-badge">Memuat...</span>
          </div>
        </div>
      </header>

      <!-- Area Konten Dinamis -->
      <div id="admin-content" class="flex-1 overflow-y-auto p-6 md:p-8">
        <div class="text-center py-12 text-slate-400 text-sm">Memuat data...</div>
      </div>

    </main>
  </div>

  <!-- ================= MODAL EDIT / TAMBAH BUKU ================= -->
  <div id="modal-book" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-2xl shadow-2xl flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between p-6 border-b border-slate-100">
        <h2 id="modal-book-title" class="font-bold text-lg text-slate-900">Tambah Buku</h2>
        <button onclick="closeModal('modal-book')" class="text-slate-400 hover:text-red-500 text-xl">&times;</button>
      </div>
      
      <div class="p-6 overflow-y-auto space-y-4 flex-1">
        <input type="hidden" id="book-id" value="">
        
        <div>
          <label class="block text-xs font-semibold text-slate-700 mb-1">Link PDF (Google Drive)</label>
          <div class="flex gap-2">
            <input id="book-pdf" type="url" placeholder="https://drive.google.com/..." class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900" />
            <button type="button" onclick="autoExtractPdf()" class="px-4 py-2.5 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold hover:bg-slate-200 shrink-0">Ekstrak</button>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Judul Buku</label>
            <input id="book-title" type="text" placeholder="Masukkan judul" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Kategori</label>
            <select id="book-category" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900 bg-white">
              <!-- Diisi via JS -->
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">Penulis / Penyusun</label>
            <input id="book-author" type="text" value="Tim Guru SMAN 2 Karanganyar" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-700 mb-1">URL Sampul (Opsional)</label>
            <input id="book-thumb" type="text" placeholder="https://..." class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900" />
          </div>
        </div>
      </div>

      <div class="p-6 border-t border-slate-100 flex justify-end gap-3 bg-slate-50 rounded-b-2xl">
        <button onclick="closeModal('modal-book')" class="px-5 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-200 transition">Batal</button>
        <button onclick="saveBook()" id="btn-save-book" class="px-5 py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 transition shadow-md">Simpan Data</button>
      </div>
    </div>
  </div>

  <!-- ================= MODAL TAMBAH KATEGORI ================= -->
  <div id="modal-cat" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm shadow-2xl p-6">
      <h2 class="font-bold text-lg text-slate-900 mb-4">Tambah Kategori Baru</h2>
      <input id="new-cat-name" type="text" placeholder="Nama Kategori (Misal: Sejarah, Biologi)" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900 mb-4" />
      <div class="flex justify-end gap-2">
        <button onclick="closeModal('modal-cat')" class="px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-100">Batal</button>
        <button onclick="saveCategory()" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800">Tambah</button>
      </div>
    </div>
  </div>

  <script>
    // State Global
    let state = {
      user: JSON.parse(localStorage.getItem('smanda_admin') || 'null'),
      categories: [],
      books: [],
      activeMenu: 'umum',
      editingBookId: null
    };

    // Jalankan saat halaman dimuat
    initAdmin();

    async function initAdmin() {
      if (!state.user || (state.user.role !== 'super_admin' && state.user.role !== 'kontributor')) {
        document.getElementById('admin-login-screen').classList.remove('hidden');
        document.getElementById('admin-dashboard-screen').classList.add('hidden');
        return;
      }

      document.getElementById('admin-login-screen').classList.add('hidden');
      document.getElementById('admin-dashboard-screen').classList.remove('hidden');
      document.getElementById('admin-dashboard-screen').classList.add('flex');
      document.getElementById('adm-profile-badge').textContent = `${state.user.nama}`;

      await fetchData();
      setMenu('umum');
    }

    async function fetchData() {
      try {
        const res = await fetch('/api/init');
        const data = await res.json();
        if (data.ok) {
          state.categories = data.categories;
          state.books = data.books;
        } else {
          alert("Gagal load data: " + data.error);
        }
      } catch (e) {
        alert("Error koneksi API: " + e.message);
      }
    }

    // ================== LOGIN & LOGOUT ==================
    async function handleAdminLogin(e) {
      e.preventDefault();
      const username = document.getElementById('adm-user').value;
      const password = document.getElementById('adm-pass').value;
      const errBox = document.getElementById('adm-login-error');
      const btn = document.getElementById('adm-login-btn');

      btn.innerHTML = 'Memeriksa...';
      btn.disabled = true;
      errBox.classList.add('hidden');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        
        if (!data.ok) {
          errBox.textContent = data.error || 'Gagal login.';
          errBox.classList.remove('hidden');
          return;
        }
        if (data.user.role !== 'super_admin' && data.user.role !== 'kontributor') {
          errBox.textContent = 'Akun siswa tidak memiliki izin masuk ke halaman ini.';
          errBox.classList.remove('hidden');
          return;
        }
        
        state.user = data.user;
        localStorage.setItem('smanda_admin', JSON.stringify(data.user));
        initAdmin();
      } catch (err) {
        errBox.textContent = 'Kesalahan jaringan: ' + err.message;
        errBox.classList.remove('hidden');
      } finally {
        btn.innerHTML = 'Masuk ke Dashboard';
        btn.disabled = false;
      }
    }

    function adminLogout() {
      state.user = null;
      localStorage.removeItem('smanda_admin');
      initAdmin();
    }

    // ================== NAVIGASI MENU ==================
    function setMenu(menu) {
      state.activeMenu = menu;
      
      // Reset style semua menu
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-slate-900', 'text-white');
        btn.classList.add('text-slate-600', 'hover:bg-slate-50');
      });
      
      // Highlight menu aktif
      const activeBtn = document.getElementById('nav-' + menu);
      if(activeBtn) {
        activeBtn.classList.remove('text-slate-600', 'hover:bg-slate-50');
        activeBtn.classList.add('bg-slate-900', 'text-white');
      }

      // Ubah judul halaman
      const titles = {
        'umum': 'Kelola Buku Umum',
        'referensi': 'Kelola Buku Referensi',
        'users': 'Manajemen Akun (Admin & Siswa)'
      };
      document.getElementById('page-title').textContent = titles[menu];

      // Render Konten
      if(menu === 'users') {
        renderUsersMenu();
      } else {
        renderBooksMenu();
      }
    }

    // ================== RENDER MENU BUKU (UMUM & REFERENSI) ==================
    function renderBooksMenu() {
      const isUmum = state.activeMenu === 'umum';
      const catData = state.categories.filter(c => c.access_type === state.activeMenu);
      const filteredBooks = state.books.filter(b => b.access_type === state.activeMenu);

      const html = `
        <!-- Toolbar -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
          <div class="flex gap-2">
            <button onclick="openModalBook()" class="px-4 py-2 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 transition shadow-sm flex items-center gap-2">
              <i class="fa-solid fa-plus"></i> Tambah ${isUmum ? 'Buku Umum' : 'Referensi'}
            </button>
            <button onclick="openModalCat()" class="px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-700 text-sm font-semibold hover:bg-slate-50 transition shadow-sm flex items-center gap-2">
              <i class="fa-solid fa-folder-plus"></i> Kategori
            </button>
          </div>
          
          <div class="flex gap-2 w-full md:w-auto">
            <select id="filter-cat" onchange="filterTableBooks()" class="px-3 py-2 rounded-xl border border-slate-200 text-sm bg-white outline-none focus:border-slate-900">
              <option value="all">Semua Kategori</option>
              ${catData.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
            </select>
            <input type="text" id="search-book" oninput="filterTableBooks()" placeholder="Cari judul buku..." class="px-3 py-2 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900 w-full md:w-64" />
          </div>
        </div>

        <!-- Tabel Buku -->
        <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
          <table class="w-full text-left border-collapse" id="table-books">
            <thead class="bg-slate-50 border-b border-slate-200">
              <tr>
                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Judul Buku & Kategori</th>
                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider">Penulis</th>
                <th class="px-6 py-4 text-xs font-semibold text-slate-500 uppercase tracking-wider text-right">Aksi</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 text-sm">
              ${filteredBooks.length === 0 ? `<tr><td colspan="3" class="px-6 py-8 text-center text-slate-400">Belum ada data buku di kategori ini.</td></tr>` : 
                filteredBooks.map(b => `
                  <tr class="hover:bg-slate-50/50 transition book-row" data-title="${b.title.toLowerCase()}" data-cat="${b.category_id}">
                    <td class="px-6 py-4">
                      <div class="font-semibold text-slate-900 mb-0.5">${b.title}</div>
                      <span class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-bold tracking-wide uppercase ${isUmum ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                        ${b.category_name || 'Tanpa Kategori'}
                      </span>
                    </td>
                    <td class="px-6 py-4 text-slate-500">${b.author || '-'}</td>
                    <td class="px-6 py-4 text-right space-x-2">
                      <a href="${b.pdf_url}" target="_blank" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 transition" title="Lihat PDF"><i class="fa-solid fa-eye text-xs"></i></a>
                      <button onclick="openModalBook('${b.id}')" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 transition" title="Edit"><i class="fa-solid fa-pen text-xs"></i></button>
                      <button onclick="deleteBook('${b.id}')" class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 transition" title="Hapus"><i class="fa-solid fa-trash text-xs"></i></button>
                    </td>
                  </tr>
                `).join('')}
            </tbody>
          </table>
        </div>
      `;
      document.getElementById('admin-content').innerHTML = html;
    }

    function filterTableBooks() {
      const q = document.getElementById('search-book').value.toLowerCase();
      const cat = document.getElementById('filter-cat').value;
      document.querySelectorAll('.book-row').forEach(row => {
        const matchTitle = row.dataset.title.includes(q);
        const matchCat = cat === 'all' || row.dataset.cat === cat;
        row.style.display = (matchTitle && matchCat) ? '' : 'none';
      });
    }

    // ================== MODAL BOOK (TAMBAH / EDIT) ==================
    function openModalBook(editId = null) {
      const modal = document.getElementById('modal-book');
      const title = document.getElementById('modal-book-title');
      const catSelect = document.getElementById('book-category');
      
      // Isi Dropdown Kategori sesuai tab aktif
      const catData = state.categories.filter(c => c.access_type === state.activeMenu);
      catSelect.innerHTML = catData.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

      if (editId) {
        const book = state.books.find(b => b.id === editId);
        if (!book) return;
        
        title.textContent = 'Edit Data Buku';
        document.getElementById('book-id').value = book.id;
        document.getElementById('book-pdf').value = book.pdf_url;
        document.getElementById('book-title').value = book.title;
        document.getElementById('book-author').value = book.author;
        document.getElementById('book-thumb').value = book.thumbnail_url;
        catSelect.value = book.category_id;
      } else {
        title.textContent = 'Tambah Buku Baru';
        document.getElementById('book-id').value = '';
        document.getElementById('book-pdf').value = '';
        document.getElementById('book-title').value = '';
        document.getElementById('book-author').value = 'Tim Guru SMAN 2 Karanganyar';
        document.getElementById('book-thumb').value = '';
      }

      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    async function autoExtractPdf() {
      const url = document.getElementById('book-pdf').value.trim();
      if (!url) return alert('Masukkan link PDF terlebih dahulu.');
      
      const btn = event.target;
      const oldText = btn.innerHTML;
      btn.innerHTML = 'Memproses...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/extract', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pdf_url: url })
        });
        const data = await res.json();
        if (data.ok) {
          document.getElementById('book-title').value = data.title || '';
          document.getElementById('book-thumb').value = data.thumbnailUrl || '';
        } else {
          alert('Gagal mengekstrak metadata.');
        }
      } catch (e) {
        alert('Error ekstraksi: ' + e.message);
      } finally {
        btn.innerHTML = oldText;
        btn.disabled = false;
      }
    }

    async function saveBook() {
      const id = document.getElementById('book-id').value;
      const pdf_url = document.getElementById('book-pdf').value.trim();
      const title = document.getElementById('book-title').value.trim();
      const category_id = document.getElementById('book-category').value;
      const author = document.getElementById('book-author').value.trim();
      const thumbnail_url = document.getElementById('book-thumb').value.trim();

      if (!pdf_url || !title) return alert('Link PDF dan Judul wajib diisi.');

      const btn = document.getElementById('btn-save-book');
      btn.innerHTML = 'Menyimpan...';
      btn.disabled = true;

      try {
        // Catatan: Anda memerlukan API edit / PUT untuk update data.
        // Jika API belum ada, ini hanya akan insert data baru.
        const urlApi = id ? '/api/books/update' : '/api/books'; 
        
        const payload = {
          id: id,
          title, author, pdf_url, thumbnail_url, category_id,
          access_type: state.activeMenu,
          uploaded_by: state.user.username
        };

        const res = await fetch(urlApi, {
          method: 'POST', // Ubah ke PUT jika backend Anda sudah support
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        if (data.ok) {
          closeModal('modal-book');
          await fetchData();
          setMenu(state.activeMenu);
        } else {
          alert("Gagal menyimpan: " + data.error);
        }
      } catch (e) {
        alert("Kesalahan koneksi: " + e.message);
      } finally {
        btn.innerHTML = 'Simpan Data';
        btn.disabled = false;
      }
    }

    async function deleteBook(id) {
      if (!confirm('Yakin ingin menghapus dokumen ini secara permanen?')) return;
      try {
        await fetch('/api/books/delete', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id })
        });
        await fetchData();
        setMenu(state.activeMenu);
      } catch (e) {
        alert("Gagal menghapus: " + e.message);
      }
    }

    // ================== MODAL KATEGORI ==================
    function openModalCat() {
      document.getElementById('modal-cat').classList.remove('hidden');
      document.getElementById('modal-cat').classList.add('flex');
      document.getElementById('new-cat-name').value = '';
      document.getElementById('new-cat-name').focus();
    }

    async function saveCategory() {
      const name = document.getElementById('new-cat-name').value.trim();
      if (!name) return;

      try {
        await fetch('/api/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, access_type: state.activeMenu })
        });
        closeModal('modal-cat');
        await fetchData();
        setMenu(state.activeMenu);
      } catch (e) {
        alert("Gagal menambah kategori: " + e.message);
      }
    }

    // ================== RENDER MENU USERS (AKUN) ==================
    function renderUsersMenu() {
      if (state.user.role !== 'super_admin') {
        document.getElementById('admin-content').innerHTML = `<div class="bg-amber-50 text-amber-800 p-4 rounded-xl border border-amber-200 text-sm">Hanya Super Admin yang dapat mengakses Manajemen Akun.</div>`;
        return;
      }

      document.getElementById('admin-content').innerHTML = `
        <div class="grid md:grid-cols-3 gap-6">
          <!-- Form Tambah Akun -->
          <div class="md:col-span-1 bg-white border border-slate-200 rounded-2xl p-6 h-fit shadow-sm">
            <h2 class="font-bold text-slate-900 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-user-plus text-slate-400"></i> Tambah Akun Baru
            </h2>
            <form onsubmit="createUser(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Nama Lengkap</label>
                <input id="usr-nama" type="text" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Username / NIS</label>
                <input id="usr-username" type="text" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                <input id="usr-pass" type="text" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none focus:border-slate-900" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Hak Akses (Role)</label>
                <select id="usr-role" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm outline-none bg-white focus:border-slate-900">
                  <option value="kontributor">Turunan Admin (Guru/Petugas)</option>
                  <option value="siswa">Siswa (Akses Referensi)</option>
                  <option value="super_admin">Super Admin</option>
                </select>
              </div>
              <button type="submit" class="w-full py-2.5 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-800 transition">Buat Akun</button>
            </form>
          </div>

          <!-- Tabel Daftar Akun -->
          <div class="md:col-span-2 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden flex flex-col">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
              <h2 class="font-bold text-slate-900 text-sm">Daftar Pengguna Terdaftar</h2>
            </div>
            <div id="users-list-box" class="overflow-y-auto flex-1">
              <div class="p-8 text-center text-slate-400 text-sm">Memuat akun...</div>
            </div>
          </div>
        </div>
      `;
      loadUsersList();
    }

    async function loadUsersList() {
      try {
        const res = await fetch('/api/users');
        const data = await res.json();
        const box = document.getElementById('users-list-box');
        if (!box || !data.ok) return;
        
        if(data.users.length === 0) {
           box.innerHTML = '<div class="p-8 text-center text-slate-400 text-sm">Belum ada akun terdaftar.</div>';
           return;
        }

        box.innerHTML = data.users.map(u => `
          <div class="flex items-center justify-between p-4 border-b border-slate-100 hover:bg-slate-50 transition">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center font-bold text-xs uppercase">
                ${u.nama.charAt(0)}
              </div>
              <div>
                <div class="font-semibold text-sm text-slate-800">${u.nama}</div>
                <div class="text-xs text-slate-500">@${u.username} • <span class="uppercase text-[10px] font-bold text-slate-400">${u.role}</span></div>
              </div>
            </div>
            <div>
               <button onclick="toggleUser('${u.id}', ${String(u.is_active) === '1' ? 0 : 1})" class="text-xs font-semibold px-3 py-1.5 rounded-lg border ${String(u.is_active) === '1' ? 'bg-emerald-50 text-emerald-700 border-emerald-200 hover:bg-emerald-100' : 'bg-red-50 text-red-600 border-red-200 hover:bg-red-100'} transition">
                  ${String(u.is_active) === '1' ? 'Aktif' : 'Nonaktif'}
               </button>
            </div>
          </div>
        `).join('');
      } catch(e) { console.error(e); }
    }

    async function createUser(e) {
      e.preventDefault();
      const nama = document.getElementById('usr-nama').value.trim();
      const username = document.getElementById('usr-username').value.trim();
      const password = document.getElementById('usr-pass').value.trim();
      const role = document.getElementById('usr-role').value;
      
      const btn = e.target.querySelector('button[type="submit"]');
      btn.innerHTML = 'Menyimpan...'; btn.disabled = true;

      try {
        await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama, username, password, role })
        });
        e.target.reset();
        loadUsersList();
      } catch (err) {
        alert("Gagal tambah akun: " + err.message);
      } finally {
        btn.innerHTML = 'Buat Akun'; btn.disabled = false;
      }
    }

    async function toggleUser(id, is_active) {
      try {
        await fetch('/api/users/toggle', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, is_active })
        });
        loadUsersList();
      } catch (e) { alert("Gagal update status akun."); }
    }

    // ================== UTILITY ==================
    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
      document.getElementById(id).classList.remove('flex');
    }
  </script>
</body>
</html>
